name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install "pytest>=8,<10"

      - name: Unit + integration suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -v --no-header 2>&1 | tee "$RUNNER_TEMP/pytest-output.txt"

      - name: Suite must not dirty the checkout
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::la suite dejo el arbol de trabajo sucio:"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Bytecode compile check (build)
        run: python -m compileall -q arena_forge.py forge tests tools

      - name: Lint (propio, sin dependencias externas)
        shell: bash
        run: |
          set -o pipefail
          python tools/lint.py 2>&1 | tee "$RUNNER_TEMP/lint-output.txt"

      - name: Lint self-tests (control negativo del lint)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tools/test_lint.py -v --no-header 2>&1 | tee "$RUNNER_TEMP/lint-selftest-output.txt"

      - name: Upload diagnostics (si falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-output.txt
                 ${{ runner.temp }}/lint-output.txt
                 ${{ runner.temp }}/lint-selftest-output.txt
          if-no-files-found: ignore

      - name: CLI smoke (init + gates + report + apply)
        shell: bash
        run: |
          set -euo pipefail
          python arena_forge.py plan --agents 2 --profile quick
          python arena_forge.py init --mode patch --agents 2 --seed 11 \
            --task "corregir el denominador en stats.py" \
            --baseline-dir fixtures/patch-demo/baseline_buggy \
            --suite fixtures/patch-demo/tests_protected --profile quick
          RUN=$(cat .arena/LATEST)
          cp fixtures/patch-demo/candidate_fixed/stats.py "$RUN/candidates/cand-01/stats.py"
          python arena_forge.py gates --dir "$RUN"
          python arena_forge.py report --dir "$RUN"
          python arena_forge.py apply --dir "$RUN" --approve
          # El parche usa rutas RELATIVAS al directorio del baseline: se
          # comprueba desde el repo destino con --directory.
          PATCH="reports/$(basename "$RUN").patch"
          git -c core.autocrlf=false -c core.eol=lf apply --check \
            --directory=fixtures/patch-demo/baseline_buggy "$PATCH"
          # El arbol principal debe quedar intacto:
          git diff --exit-code -- fixtures/patch-demo/baseline_buggy
          echo "E2E patch (asistido): OK"

      - name: CLI smoke (answer arena + NO_SHIP)
        shell: bash
        run: |
          python arena_forge.py init --mode answer --agents 2 --seed 7 \
            --task "escribir una funcion que calcule el factorial" --profile quick
          python arena_forge.py state
          python arena_forge.py ledger --verify
